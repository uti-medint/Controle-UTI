<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b5e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Passômetro">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Passômetro – UTI IOG</title>
<style>
:root{
  --bg:#f2f5f4; --panel:#ffffff; --ink:#1b2a29; --muted:#5f716f; --line:#d4dcda;
  --accent:#0f6b5e; --accent-soft:#e1f0ed; --atb:#a8470a; --atb-soft:#fbeadd;
  --danger:#b3261e; --focus:#1a73e8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.4}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

#app{display:flex;flex-direction:column;height:100vh}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.field-inline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.field-inline input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff}
.field-inline input.unit{width:110px;font-weight:600;color:var(--ink)}
.spacer{flex:1}
.saved{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;color:var(--ink)}
.btn:hover{background:#f0f4f3}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0b574c}
.btn.danger{color:var(--danger)}
.btn.small{padding:3px 8px;font-size:13px}

main{flex:1;display:flex;min-height:0}
nav.beds{width:250px;flex:none;overflow-y:auto;border-right:1px solid var(--line);background:var(--panel);padding:8px}
nav.beds .group{font-size:13px;color:var(--muted);padding:10px 8px 4px;font-weight:600}
.bed-btn{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:7px 10px;margin-bottom:2px}
.bed-btn:hover{background:#eef3f2}
.bed-btn.active{background:var(--accent-soft);border-color:#b7d8d2}
.bed-btn .l1{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.bed-btn .l1 small{font-weight:500;color:var(--muted)}
.bed-btn .l2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bed-btn.empty .l1{color:#8a9a98;font-weight:500}
.bed-btn.inactive{opacity:.55}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
.dot.atb{background:var(--atb)}

section.editor{flex:1;overflow-y:auto;padding:20px 28px 60px}
.editor-inner{max-width:980px;margin:0 auto}
.bed-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bed-title h2{margin:0;font-size:24px;letter-spacing:-.01em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16px}
.grid4{display:grid;grid-template-columns:2fr 0.7fr 1.1fr 1.6fr;gap:12px}
@media(max-width:900px){.grid4{grid-template-columns:1fr 1fr}nav.beds{width:190px}}
label.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
input.txt{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;min-height:38px}

/* picker */
.picker{position:relative;border:1px solid var(--line);border-radius:8px;background:#fff;padding:5px 6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:40px;cursor:text}
.picker:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.picker input{flex:1;min-width:140px;border:none;outline:none;padding:4px;background:transparent}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:#0a4a41;border-radius:14px;padding:3px 4px 3px 10px;font-size:14px}
.chip button{border:none;background:none;color:inherit;font-size:16px;line-height:1;padding:0 5px;border-radius:50%}
.chip button:hover{background:rgba(0,0,0,.1)}
.dd{position:absolute;left:-1px;right:-1px;top:calc(100% + 4px);z-index:20;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(20,40,38,.16);max-height:260px;overflow-y:auto;padding:4px}
.dd[hidden]{display:none}
.dd .opt{padding:7px 10px;border-radius:6px;cursor:pointer}
.dd .opt.on,.dd .opt:hover{background:var(--accent-soft)}
.dd .opt.new{color:var(--accent);font-weight:600;border-top:1px solid var(--line);border-radius:0 0 6px 6px}
.dd .none{padding:8px 10px;color:var(--muted);font-size:14px}

/* devices */
.devs{display:flex;flex-wrap:wrap;gap:8px}
.tog{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:8px 16px;font-weight:600;color:var(--muted)}
.tog:hover{border-color:#9bb8b3}
.tog.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dev-sites{margin-top:12px;display:grid;gap:10px}
.dev-sites .row{display:grid;grid-template-columns:120px 150px 210px 1fr;gap:10px;align-items:center}
.dev-badge{font-weight:600;color:var(--muted);font-size:14px}
.dev-badge.warn{color:#fff;background:var(--danger);border-radius:14px;padding:3px 10px;justify-self:start}
.alert-banner{background:#fdecea;border:1px solid #f1b8b3;color:var(--danger);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-weight:600}
.dot.alert{background:var(--danger)}
.dot.prec{background:#000;outline:2px solid #f5b800}
.prec-banner{background:#000;color:#ffd93b;border:3px solid #f5b800;padding:12px 16px;border-radius:8px;margin-bottom:14px;font-weight:900;font-size:18px;letter-spacing:.5px}
.prec-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.tog.prec.on{background:#000;border-color:#000;color:#ffd93b}
.xalert{border:4px solid #d9480f;background:#fff4e6}
.xalert h2{margin:0 0 10px;color:#b02a00;font-size:24px}
.xalert .xa{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;background:#fff;border:2px solid #f0b27a;margin:10px 0;font-size:17px;line-height:1.4}
.xalert .xa .n{flex:none;background:#d9480f;color:#fff;font-weight:900;border-radius:50%;width:30px;height:30px;display:grid;place-items:center}
.rowbox{display:grid;gap:10px;align-items:end;padding:10px;border:1px solid var(--line);background:#f8fbfa;border-radius:8px;margin-bottom:8px}
.img-row{grid-template-columns:1.3fr 140px 2fr 34px}
.cul-row{grid-template-columns:140px 1.2fr 1.3fr 1.8fr 34px}
@media(max-width:900px){.rowbox.img-row,.rowbox.cul-row{grid-template-columns:1fr 1fr}.dev-sites .row{grid-template-columns:1fr 1fr}}
.resp-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.resp-row .picker{flex:1;min-width:260px}
.dev-sites .row b{color:var(--accent)}

/* antibióticos */
.atb-row{display:grid;grid-template-columns:2fr 1fr 1fr 130px 34px;gap:10px;align-items:end;padding:10px;border:1px solid #efd5c0;background:#fff9f4;border-radius:8px;margin-bottom:8px}
.atb-row .picker{border-color:#e6cdb8}
.atb-row input[type=date]{width:100%;border:1px solid #e6cdb8;border-radius:6px;padding:7px 8px;background:#fff;min-height:40px}
.atb-day{font-weight:700;color:var(--atb);text-align:center;padding-bottom:9px}
.atb-day.fin{color:var(--muted);font-size:.9em}
.tog.add{border-style:dashed}
.out-row{display:grid;grid-template-columns:2fr 150px 1.5fr 80px 34px;gap:10px;align-items:end}
.rowbox.proc-row{grid-template-columns:minmax(0,1.3fr) 150px 140px minmax(0,1.1fr) 140px 34px}
.anest.feito.on{background:#e3f4ea;border-color:#2e8b57;color:#1f6b41}
@media(max-width:900px){.out-row,.rowbox.proc-row{grid-template-columns:1fr 1fr}}
.x-btn{border:none;background:none;color:var(--muted);font-size:22px;border-radius:6px;height:36px}
.x-btn:hover{background:#f6e3d3;color:var(--danger)}
@media(max-width:900px){.atb-row{grid-template-columns:1fr 1fr}}
.toggle-row{display:flex;align-items:center;gap:8px}
.toggle-row input{width:18px;height:18px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,30,28,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:12px;width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-size:18px}
.modal .body{padding:16px 18px;overflow-y:auto}
.list-item{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid #eef2f1}
.list-item input{flex:1;border:1px solid transparent;border-radius:6px;padding:6px 8px;background:transparent}
.list-item input:hover{border-color:var(--line)}
.list-item input:focus{border-color:var(--accent);background:#fff}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2a29;color:#fff;padding:10px 18px;border-radius:8px;z-index:200;font-size:14px}

.saved.bad{color:var(--danger);font-weight:600}
.net-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff6e5;border-bottom:1px solid #f0cf8a;color:#6b4300;padding:8px 20px;font-weight:600}
.net-banner[hidden]{display:none}
#app[hidden],#hub[hidden],#pocusApp[hidden],#examApp[hidden]{display:none!important}
#hub,#pocusApp,#examApp{display:flex;flex-direction:column;height:100vh}
.hub-wrap{flex:1;overflow-y:auto;padding:36px 24px;max-width:980px;width:100%;margin:0 auto}
.hub-wrap h2{margin:0 0 18px;font-size:22px;letter-spacing:-.01em}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.hub-card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 22px 24px;min-height:170px;transition:border-color .15s,box-shadow .15s,transform .15s}
.hub-card:hover{border-color:var(--accent);box-shadow:0 6px 20px rgba(15,107,94,.12);transform:translateY(-1px)}
.hub-ic{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.hub-ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hub-t{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hub-d{color:var(--muted);font-size:14px}
.hub-card.soon{background:#f7f9f8;border-style:dashed}
.hub-card.soon .hub-ic{background:#eceff0;color:#7a8b89}
.badge{font-size:11px;font-weight:700;background:#eceff0;color:#5f716f;border-radius:10px;padding:2px 8px;text-transform:uppercase;letter-spacing:.04em}

.exm-row{grid-template-columns:minmax(0,1fr) minmax(0,2.4fr) 34px}
.rowbox>div,.exm-detail>div{min-width:0}.rowbox input.txt,.exm-detail input.txt{width:100%}
.exm-detail{display:grid;grid-template-columns:minmax(150px,1.2fr) 140px 150px 140px;gap:10px;align-items:end}
.anest{min-height:40px;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:0 14px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.anest.on{background:var(--atb-soft);border-color:var(--atb);color:var(--atb)}
@media(max-width:900px){.rowbox.exm-row,.exm-detail{grid-template-columns:1fr}}

.poc-wrap{flex:1;overflow-y:auto;padding:18px 24px 70px}
.poc-inner{max-width:920px;margin:0 auto}
.poc-blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.poc-block{min-height:58px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-weight:700;color:var(--ink);text-align:left}
.poc-block small{display:block;font-weight:500;color:var(--muted)}
.poc-block.on{background:var(--accent);border-color:var(--accent);color:#fff}
.poc-block.on small{color:#d6ece8}
.poc-strip{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:12px;margin-bottom:16px}
@media(max-width:800px){.poc-strip{grid-template-columns:1fr}}
.poc-title{margin:6px 0 10px;font-size:20px;color:var(--accent)}
.poc-interp{position:sticky;top:0;z-index:5;max-height:38vh;overflow-y:auto;background:#f1f8f6;border:1px solid #b7d8d2;border-left:5px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.poc-ih{font-weight:700;margin-bottom:4px}
.poc-r{padding:6px 0;border-top:1px solid #d9eae7}
.poc-r:first-of-type{border-top:none}
.poc-r.alerta{background:#fff6e5;border-left:4px solid #e09b1a;padding-left:8px}
.poc-r b{display:block;font-size:13px;color:#2f4a46}
.poc-item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.poc-item .nm{font-weight:700}
.poc-item .rf{color:var(--muted);font-size:13px}
.poc-opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.poc-opt{min-height:46px;padding:0 18px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-weight:600;color:var(--muted)}
.poc-opt:hover{border-color:#9bb8b3}
.poc-opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.poc-opt.on.alt{background:var(--atb);border-color:var(--atb)}
.pnum{width:110px;min-height:46px;text-align:center;font-weight:600}
.un{color:var(--muted);font-size:14px}
.poc-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

.poc-block.has{border-color:var(--accent)}
.poc-block.has:not(.on){background:#f1f8f6}
.chip.dev{background:#e8eef9;color:#1f3d7a;padding-right:10px}
.chip.dev.warn{background:#fdecea;color:var(--danger);font-weight:700}
.poc-pac .lb2{font-size:12px;color:var(--muted);margin:6px 0 2px}
.hub-logo{height:34px;width:auto;margin-right:4px}
/* impressão */
#printArea{display:none}
@page{size:A4 landscape;margin:8mm}
@page portrait1{size:A4 portrait;margin:10mm}
@page xport{size:A4 portrait;margin:0}
@page xland{size:A4 landscape;margin:0}
@page xa5{size:A5 portrait;margin:0}
.sheet-portrait{page:portrait1}

.lab-box{display:block}
.lab-ex{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 34px;gap:10px;align-items:end;margin-bottom:8px}
.lab-res{display:grid;grid-template-columns:160px minmax(0,1fr) 34px;gap:10px;align-items:center;margin-bottom:6px}
.lab-res input.txt,.lab-ex input.txt{width:100%}
.lab-trend{margin:6px 0 8px;font-weight:600}
/* ===== Celular ===== */
.m-only{display:none}
@media(max-width:700px){
  html,body{overscroll-behavior-y:none}
  body{font-size:16px;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  input,textarea,select{font-size:16px!important}               /* evita o zoom automático do iPhone ao tocar num campo */
  #app{height:100dvh}
  header.top{padding:calc(8px + env(safe-area-inset-top)) 10px 8px;gap:8px}
  header.top h1{font-size:18px}
  header.top .btn{min-height:40px;padding:6px 12px}
  #bPrint,#bWord,#bLogo,#bBackup,#hubLogoBtn,#userInfo{display:none!important}   /* impressão, Word, logo e backup ficam só no computador */
  .field-inline{flex:1 1 140px}
  .field-inline input.unit{width:100%}
  .field-inline input{min-height:40px;flex:1;min-width:0}
  .spacer{display:none}
  main{display:block;position:relative;overflow:hidden}
  nav.beds{width:100%;height:100%;border-right:0;padding:8px 10px 24px}
  .bed-btn{padding:12px 14px;margin-bottom:6px;border-color:var(--line);background:#fff}
  .bed-btn .l1{font-size:17px}
  .bed-btn .l2{font-size:14px}
  section.editor{height:100%;padding:10px 10px calc(70px + env(safe-area-inset-bottom))}
  body:not(.m-ed) #app section.editor{display:none}
  body.m-ed #app header.top>:not(#bMenu):not(#svcTitle):not(#savedMsg){display:none!important}   /* dentro do leito, o cabeçalho fica enxuto para sobrar tela */
  body.m-ed #app header.top{padding-bottom:6px}
  body.m-ed #app nav.beds{display:none}
  .m-only{display:inline-block}
  .bed-title{padding:6px 0;margin-bottom:8px}
  .bed-title h2{font-size:21px}
  .card{padding:12px 12px}
  .btn,.tog,.x-btn{min-height:42px}
  .tog{padding:8px 14px}
  .tog.sm{min-height:38px}
  .txt,.picker{min-height:44px}
  .grid4,.rowbox,.rowbox.img-row,.rowbox.cul-row,.rowbox.exm-row,.rowbox.proc-row,.exm-detail,.atb-row,.out-row,.dev-sites .row{grid-template-columns:minmax(0,1fr)!important}
  .rowbox .x-btn,.atb-row .x-btn,.out-row .x-btn{justify-self:end}
  .xgrid,.xg4{grid-template-columns:minmax(0,1fr)!important}
  .hub-wrap{padding:20px 14px}
  .hub-grid{grid-template-columns:1fr}
  .hub-card{min-height:0;padding:16px 18px}
  .no-mobile{display:none!important}                              /* pedido de exames só no computador */
  .overlay{padding:0;align-items:stretch}
  .modal{width:100%;max-height:none;height:100%;border-radius:0}
  .modal header{padding:calc(12px + env(safe-area-inset-top)) 14px 12px}
  .modal .body{padding:12px 14px calc(24px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(20px + env(safe-area-inset-bottom));max-width:92vw;text-align:center}
  .xwrap{padding:12px 10px 90px}
  .net-banner{padding:8px 12px}
  .prec-banner{font-size:16px}
  .poc-strip{grid-template-columns:1fr}
  select{min-height:44px;max-width:100%}
  .poc-interp{max-height:26vh}
  .lab-ex{grid-template-columns:minmax(0,1fr) 34px}
  .lab-ex>div:nth-child(2){grid-column:1/2}
  .lab-res{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 34px}
  .rowbox.lab-box{grid-template-columns:minmax(0,1fr)!important}
  .poc-wrap select{width:100%}
}
@media print{
  body{background:#fff}
  #app,#hub,#pocusApp,#examApp,.overlay,.toast{display:none!important}
  #printArea{display:block}
}

.xwrap{flex:1;overflow-y:auto;padding:18px 24px 70px}
.xinner{max-width:1100px;margin:0 auto}
.xg4{display:grid;grid-template-columns:1.1fr 2fr .6fr 1.2fr 1.2fr;gap:12px}
.xgrid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
.xgrid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:14px}
.xside{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:sticky;top:0}
.xped{margin-bottom:10px}.xl1{font-size:13.5px;padding:2px 0;border-bottom:1px dotted #b9c6c3}
.pack{background:#f7faf9;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.pack h4{margin:0 0 6px;font-size:14px;color:var(--accent)}
.tog.sm{padding:6px 11px;font-size:13.5px;margin:3px 6px 3px 0}
.xchip{border:1.5px solid var(--accent);background:var(--accent-soft);color:#0b4a41;border-radius:16px;padding:5px 11px;font-size:13.5px;margin:3px 6px 3px 0}
.xchip.off{background:#eceff0;border-color:#cfd6d5;color:#7a8b89;text-decoration:line-through}
.xit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, runTransaction, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCiY25Gue_LO9FtDS3d0HSng6j0q-DmDY",
  authDomain: "controle-uti-8a9b6.firebaseapp.com",
  projectId: "controle-uti-8a9b6",
  storageBucket: "controle-uti-8a9b6.firebasestorage.app",
  messagingSenderId: "1066408363792",
  appId: "1:1066408363792:web:9fe5a805305c5bf2524795"
};

try{
  const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
  const parse=d=>{ try{ return JSON.parse(d.json); }catch(e){ return null; } };
  window.FB={
    signIn:(e,p)=>signInWithEmailAndPassword(auth,e,p),
    signOut:()=>signOut(auth),
    resetPassword:e=>sendPasswordResetEmail(auth,e),
    onAuth:cb=>onAuthStateChanged(auth,cb),
    listen:(onBatch,onErr)=>onSnapshot(collection(db,"parts"),snap=>{
      onBatch(snap.docChanges().map(ch=>{ const d=ch.doc.data(); return {type:ch.type,part:ch.doc.id,v:d.v,value:parse(d),by:d.by,cid:d.cid}; }));
    },onErr),
    put:(part,base,value,by,cid)=>runTransaction(db,async tx=>{
      const ref=doc(db,"parts",part), snap=await tx.get(ref);
      const cur=snap.exists()?snap.data():null, cv=cur?cur.v:0;
      if(cv!==(base||0)) return {conflict:true,current:cur?{v:cur.v,value:parse(cur),by:cur.by}:null};
      tx.set(ref,{v:cv+1,json:JSON.stringify(value),by:by||"",cid:cid||"",ts:Date.now()});
      return {v:cv+1};
    }),
    remove:part=>deleteDoc(doc(db,"parts",part))
  };
  window.__fbResolve(window.FB);
}catch(e){ console.error(e); window.__fbResolve(null); }
</script>

  medico:[],
  npend:["Banho no leito","Higiene oral","Mudança de decúbito","Curativo de CVC","Troca de fixação do TOT","Troca de equipos","Troca de SVD","Troca de SNE","Aspiração de vias aéreas","Glicemia capilar","Coleta de exames laboratoriais","Balanço hídrico","Aguardando transporte","Preparar para transferência"],
  sPA:["Femoral D","Femoral E","Radial D","Radial E"],
  procOutros:["Cateter de hemodiálise","PICC","Marcapasso transitório","Cateter epidural","Cateter de Swan-Ganz","ECMO","Balão intra-aórtico"],
  sOutros:["Jugular D","Jugular E","Subclávia D","Subclávia E","Femoral D","Femoral E","Radial D","Radial E","Braço D","Braço E","Tórax D","Tórax E","Abdome"],
  examLab:[], examRx:[], examTc:[], examRm:[], examLivre:[],
  procP:["Passagem de CVC","Passagem de acesso arterial (PAI)","Intubação orotraqueal","Traqueostomia","Drenagem torácica","Paracentese","Toracocentese","Punção lombar","Cateter de hemodiálise","PICC","Passagem de SNE","Endoscopia digestiva alta","Broncoscopia","Retirada de dreno","Curativo extenso"]
};
const DEVS=[["svd","SVD"],["sne","SNE"],["gtt","GTT"],["tot","TOT"],["tqt","TQT"],["avp","AVP"],["cvc","CVC"],["cdl","CDL"],["pa","Punção arterial"],["dreno","Dreno"]];
const SITED={cvc:"sCVC",cdl:"sCDL",pa:"sPA",dreno:"sDreno"};
const THRESH=10;                      /* citações para um texto novo entrar na lista de sugestões */
const IMEDIATO={medico:true};         /* nomes de médicos entram na lista já na primeira vez */
const ALERT_DIAS=15;
const N_FIXOS = 17, N_EXTRAS = 4;

/* Cadastro único por leito, compartilhado entre passômetro médico, enfermagem e POCUS:
   identificação, lista de problemas, dispositivos invasivos e situação do leito ficam em SHARED.pac[idDoLeito]. */
const PAC_KEYS=["pid","nome","idade","admissao","plano","problemas","disp","dd","ativo","local"];
const PAC_MOVE=["pid","nome","idade","admissao","plano","problemas","disp","dd"];
const SVC_KEYS=["atb","culturas","imagem","pend","condutas","exm","proc","labesp","resp"];
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function defaultDisp(){ return {svd:false,sne:false,gtt:false,tot:false,tqt:false,avp:false,prec:{on:false,resp:false,cont:false},cvc:{on:false,sitios:[]},cdl:{on:false,sitios:[]},pa:{on:false,sitios:[]},dreno:{on:false,sitios:[]},outros:[]}; }
function defaultPac(id){ return {pid:"",nome:"",idade:"",admissao:"",plano:"",problemas:[],disp:defaultDisp(),dd:{},ativo:!String(id).startsWith("E"),local:""}; }
function pacOf(id){ return SHARED.pac[id]||(SHARED.pac[id]=defaultPac(id)); }
function pacPristine(p,id){
  const d=defaultPac(id);
  const dev=DEVS.some(([k])=>{ const v=p.disp&&p.disp[k]; return v&&typeof v==="object"?!!v.on:!!v; });
  return !p.pid && ["nome","idade","admissao","plano","local"].every(k=>!p[k]) && !(p.problemas||[]).length
    && !dev && !(p.disp&&p.disp.prec&&p.disp.prec.on) && !((p.disp&&p.disp.outros)||[]).length && !Object.keys(p.dd||{}).length && p.ativo===d.ativo;
}
function bindPac(b){
  PAC_KEYS.forEach(k=>Object.defineProperty(b,k,{get:()=>pacOf(b.id)[k],set:v=>{ pacOf(b.id)[k]=v; },enumerable:false,configurable:true}));
}
function absorbLegacy(b){          /* dados antigos (identificação dentro do leito) passam para o cadastro único */
  if(!b||!b.id) return;
  const got={}; let any=false;
  PAC_KEYS.forEach(k=>{ const d=Object.getOwnPropertyDescriptor(b,k); if(d&&("value" in d)){ got[k]=d.value; any=true; delete b[k]; } });
  if(!any) return;
  const p=pacOf(b.id);
  if(got.disp) got.disp=Object.assign(defaultDisp(),got.disp);
  if(pacPristine(p,b.id)) PAC_KEYS.forEach(k=>{ if(got[k]!==undefined) p[k]=got[k]; });
}
function newBed(id, extra){
  return {id, extra, atb:[], culturas:[], imagem:[], pend:[], condutas:[], exm:[], proc:[], labesp:{on:false,exames:[]}, resp:"", upd:null};
}
function precOf(b){ const v=b.disp&&b.disp.prec; return (v&&typeof v==="object")?v:{on:false,resp:false,cont:false}; }
function precTxt(b){ const v=precOf(b); const a=[]; if(v.resp) a.push("RESPIRATÓRIA"); if(v.cont) a.push("CONTATO"); return a.join(" + "); }
function precHtml(b){ const t=precTxt(b); return t?`<br><span style="display:inline-block;margin-top:4px;padding:2px 6px;border:2px solid #000;background:#000;color:#fff;font-weight:900;font-size:.95em;-webkit-print-color-adjust:exact;print-color-adjust:exact">⚠ PRECAUÇÃO ${t}</span>`:""; }
function devOn(b,k){ const v=b.disp[k]; return (v&&typeof v==='object')?!!v.on:!!v; }
const DEV_OBJ=["cvc","cdl","pa","dreno"];
function setDevOn(b,k,val){
  if(DEV_OBJ.includes(k)){ if(!b.disp[k]||typeof b.disp[k]!=='object') b.disp[k]={on:false,sitios:[]}; b.disp[k].on=val; }
  else b.disp[k]=val;
}
function devEntries(b,ref){            /* todos os dispositivos em uso (fixos + "Outros"), com sítio, data e dia */
  const dd=b.dd||{}, out=[];
  DEVS.forEach(([k,l])=>{
    if(!devOn(b,k)) return;
    const sit=(SITED[k]&&b.disp[k].sitios&&b.disp[k].sitios.length)?b.disp[k].sitios.join(", "):"";
    out.push({k,l,sit,data:dd[k]||"",d:daysSince(dd[k],ref)});
  });
  ((b.disp&&b.disp.outros)||[]).forEach((o,i)=>{
    if(!o||!(o.proc||o.sitio||o.data)) return;
    out.push({k:"o"+i,l:o.proc||"Outro",sit:o.sitio||"",data:o.data||"",d:daysSince(o.data,ref)});
  });
  return out;
}
function devAlerts(b,ref){ return devEntries(b,ref).filter(x=>x.data&&x.d>ALERT_DIAS); }
function atbInfo(a,ref){               /* contagem do antibiótico: para ao chegar a data de término */
  if(!a.nome||!a.ini) return {txt:"",fin:false};
  if(a.fim&&ref&&a.fim<=ref&&a.fim>=a.ini){ const n=daysSince(a.ini,a.fim); return {txt:"Finalizado · "+n+" D",fin:true,n}; }
  const d=daysSince(a.ini,ref); return {txt:(d&&d>0)?"D"+d:"",fin:false,n:d};
}
function labEspOn(b){ return !!(b.labesp&&b.labesp.on); }
const LAB_MAX=5;      /* quantas datas aparecem na impressão (a tela guarda todas) */
function labNum(v){        /* número do resultado; "0,45" e "1.5" valem, "negativo" não */
  const t=String(v==null?"":v).trim(); if(!/^[<>≤≥~\s]*-?\d[\d.,]*$/.test(t)) return NaN;
  const n=t.replace(/[<>≤≥~\s]/g,""); return parseFloat(n.includes(",")?n.replace(/\./g,"").replace(",","."):n);
}
function labSeq(e){      /* "08/10 0,12 → 09/10 0,45 ↓ 10/10 0,30" */
  const r=(e.res||[]).filter(x=>x&&(x.data||String(x.valor||"").trim())).slice().sort((a,b)=>(a.data||"9999").localeCompare(b.data||"9999"));
  const sh=r.slice(-LAB_MAX), mais=r.length>sh.length;
  const f=x=>(x.data?fmtDate(x.data)+" ":"")+esc(String(x.valor||"").trim()||"—");
  let out=mais?"… ":"";
  sh.forEach((x,i)=>{
    if(i>0){ const a=labNum(sh[i-1].valor), c=labNum(x.valor); let sep="→";
      if(i===sh.length-1&&!isNaN(a)&&!isNaN(c)&&a!==c) sep=c>a?"↑":"↓";
      out+=" "+sep+" "; }
    out+=f(x);
  });
  return out;
}
function labEspTxt(b){
  if(!labEspOn(b)) return "";
  return (b.labesp.exames||[]).filter(e=>e&&e.nome).map(e=>{
    const seq=labSeq(e);
    return `<div class="atb"><b>${esc(e.nome)}</b>${e.unidade?" ("+esc(e.unidade)+")":""}${seq?": "+seq:""}</div>`;
  }).join("");
}
function fixSvc(b){                /* somente os campos de cada passômetro */
  b.exm=Array.isArray(b.exm)?b.exm:[]; b.proc=Array.isArray(b.proc)?b.proc:[]; b.culturas=Array.isArray(b.culturas)?b.culturas:[];
  b.atb=Array.isArray(b.atb)?b.atb:[]; b.pend=Array.isArray(b.pend)?b.pend:[]; b.condutas=Array.isArray(b.condutas)?b.condutas:[];
  b.resp=b.resp||''; b.upd=b.upd||null;
  if(!b.labesp||typeof b.labesp!=='object') b.labesp={on:false,exames:[]};
  b.labesp.on=!!b.labesp.on; b.labesp.exames=Array.isArray(b.labesp.exames)?b.labesp.exames:[];
  if(Array.isArray(b.labesp.itens)&&b.labesp.itens.length){ b.labesp.itens.forEach(n=>{ if(n&&!b.labesp.exames.some(e=>e.nome===n)) b.labesp.exames.push({nome:n,unidade:"",res:[]}); }); }
  delete b.labesp.itens;
  b.labesp.exames=b.labesp.exames.map(e=>({nome:e.nome||"",unidade:e.unidade||"",res:Array.isArray(e.res)?e.res:[]}));
  b.imagem=(b.imagem||[]).map(x=>typeof x==='string'?{nome:x,data:'',achado:''}:x);
  return b;
}
function fixArch(b){               /* leito arquivado: carrega a própria cópia da identificação */
  fixSvc(b); b.disp=Object.assign(defaultDisp(),b.disp||{}); b.dd=b.dd||{};
  b.problemas=Array.isArray(b.problemas)?b.problemas:[];
  return b;
}
function fixBed(b){ absorbLegacy(b); bindPac(b); return fixSvc(b); }
function todayISO(){ const d=new Date(); return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function freshBeds(){
  const beds=[]; for(let i=1;i<=N_FIXOS;i++) beds.push(newBed("L"+i,false));
  for(let i=1;i<=N_EXTRAS;i++) beds.push(newBed("E"+i,true));
  return beds;
}

/* ============ Estado e armazenamento ============ */
/* Dois serviços (med = médico, enf = enfermagem) com leitos e histórico próprios.
   Listas, logo, exames POCUS e último responsável são compartilhados (SHARED). */
const SVCS=["med","enf"];
const SHARED={lists:{},logo:"",logoRatio:0,ultimoResp:"",pocus:[],pac:{},reg:{},ped:[]};
const SV={};
const SEL={med:"L1",enf:"L1"};
let S, selected="L1", view="hub";
function mkService(svc){
  const st={svc,unit:"UTI IOG",data:todayISO(),beds:freshBeds(),archive:[]};
  ["lists","logo","logoRatio","ultimoResp","pocus"].forEach(k=>Object.defineProperty(st,k,{get:()=>SHARED[k],set:v=>{SHARED[k]=v;},enumerable:false,configurable:true}));
  return st;
}
function normalizeService(raw,svc){
  const f=mkService(svc); raw=raw||{};
  f.unit=raw.unit||f.unit; f.data=raw.data||f.data;
  f.archive=Array.isArray(raw.archive)?raw.archive:[];
  f.archive.forEach(a=>{ a.beds=(a.beds||[]).map(fixArch); });
  const byId={}; (raw.beds||[]).forEach(b=>byId[b.id]=b);
  f.beds=f.beds.map(b=>fixBed(Object.assign(b,byId[b.id]||{})));
  return f;
}
function buildAll(raw){
  raw=raw||{};
  const legacy=raw.beds&&!raw.med;           /* formato antigo: só o passômetro médico */
  SHARED.lists=(raw.lists&&typeof raw.lists==="object")?raw.lists:{};
  for(const k in DEFAULT_LISTS) if(!Array.isArray(SHARED.lists[k])) SHARED.lists[k]=DEFAULT_LISTS[k].slice();
  SHARED.logo=raw.logo||""; SHARED.logoRatio=raw.logoRatio||0;
  SHARED.pocus=Array.isArray(raw.pocus)?raw.pocus:[];
  SHARED.ped=Array.isArray(raw.ped)?raw.ped:[];
  SHARED.pac=(raw.pac&&typeof raw.pac==='object')?raw.pac:{};
  Object.keys(SHARED.pac).forEach(id=>{ const q=SHARED.pac[id]; if(q&&typeof q==='object') q.disp=Object.assign(defaultDisp(),q.disp||{}); });
  SHARED.reg=(raw.reg&&typeof raw.reg==='object')?raw.reg:{};
  ensurePlanos();
  SV.med=normalizeService(legacy?raw:raw.med,"med");
  SV.enf=normalizeService(raw.enf,"enf");
}

/* ============ Utilitários ============ */
const $=(s,r=document)=>r.querySelector(s);
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    if(k==="class") e.className=attrs[k]; else if(k.startsWith("on")) e.addEventListener(k.slice(2),attrs[k]);
    else if(k==="html") e.innerHTML=attrs[k]; else e.setAttribute(k,attrs[k]);
  }
  kids.flat().forEach(c=>{ if(c!=null) e.append(c.nodeType?c:document.createTextNode(c)); });
  return e;
}
function toast(msg){ const t=el("div",{class:"toast"},msg); document.body.append(t); setTimeout(()=>t.remove(),2600); }
function fmtDate(iso,withYear){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return withYear?`${d}/${m}/${y}`:`${d}/${m}`; }
function daysSince(iso,ref){
  if(!iso||!ref) return null;
  return Math.round((new Date(ref+"T00:00:00")-new Date(iso+"T00:00:00"))/86400000)+1;
}
function dayCount(iso){ return daysSince(iso,S.data||todayISO()); }
function updText(b){
  return b.upd ? "Última alteração neste leito: "+new Date(b.upd).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}) : "Nenhuma alteração registrada neste leito.";
}
/* Registro de tudo o que é digitado nas listas (sem identificação do paciente). Cada computador grava só o seu
   próprio registro (reg:<id>); o total de citações é a soma de todos. Com THRESH citações o texto entra na lista. */
const RID=(()=>{ try{ let r=localStorage.getItem("passometro_rid"); if(!r){ r="r"+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4); localStorage.setItem("passometro_rid",r); } return r; }catch(e){ return "r"+Math.random().toString(36).slice(2,8); } })();
function ensurePlanos(){ const L=SHARED.lists.plano; if(Array.isArray(L)&&!L.some(x=>norm(x)==="ipasgo")){ L.push("IPASGO"); L.sort((a,b)=>a.localeCompare(b,"pt-BR",{sensitivity:"base"})); } }
function regOwn(){ return SHARED.reg[RID]||(SHARED.reg[RID]={}); }
function regTotal(key,nk){
  let n=0,t="",best=-1,l=0;
  Object.values(SHARED.reg).forEach(p=>{ const e=p&&p[key]&&p[key][nk]; if(e){ n+=e.n; l=Math.max(l,e.l||0); if(e.n>best){best=e.n;t=e.t;} } });
  return {n,t,l};
}
function regMerge(dst,src){
  Object.keys(src||{}).forEach(k=>{ const m=dst[k]||(dst[k]={});
    Object.keys(src[k]).forEach(nk=>{ const e=src[k][nk], d=m[nk];
      if(!d) m[nk]=Object.assign({},e); else { d.n=Math.max(d.n,e.n); d.l=Math.max(d.l||0,e.l||0); } }); });
}
function regPrune(o){
  let c=0; Object.keys(o).forEach(k=>c+=Object.keys(o[k]).length);
  if(c<=4000) return;
  const lim=Date.now()-90*86400000;
  Object.keys(o).forEach(k=>Object.keys(o[k]).forEach(nk=>{ const e=o[k][nk]; if(e.n<=2&&(e.l||0)<lim) delete o[k][nk]; }));
}
function regPromoteAll(){
  let ch=false;
  const keys=new Set(); Object.values(SHARED.reg).forEach(p=>Object.keys(p||{}).forEach(k=>keys.add(k)));
  keys.forEach(k=>{
    if(!Array.isArray(SHARED.lists[k])) return;
    const nks=new Set(); Object.values(SHARED.reg).forEach(p=>Object.keys((p&&p[k])||{}).forEach(x=>nks.add(x)));
    nks.forEach(nk=>{ if(SHARED.lists[k].some(x=>norm(x)===nk)) return; const t=regTotal(k,nk); if(t.n>=THRESH){ addToList(k,t.t); ch=true; } });
  });
  return ch;
}
function regRecord(key,text){
  text=String(text||"").replace(/\s+/g," ").trim(); if(!text||text.length>200) return;
  const nk=norm(text); if(!nk) return;
  const o=regOwn(), m=o[key]||(o[key]={});
  const e=m[nk]||(m[nk]={t:text,n:0,f:Date.now(),l:0}); e.n++; e.l=Date.now(); e.t=text;
  regPrune(o);
  const tot=regTotal(key,nk);
  if(tot.n>=THRESH&&Array.isArray(SHARED.lists[key])) addToList(key,text);
  save();
}
function learn(key,name){            /* usa o texto; só entra na lista de sugestões após THRESH citações (médicos: na hora) */
  name=String(name||"").replace(/\s+/g," ").trim(); if(!name) return null;
  const hit=S.lists[key].find(x=>norm(x)===norm(name)); if(hit) return hit;
  if(IMEDIATO[key]) return addToList(key,name);
  regRecord(key,name); return name;
}
function regModal(){
  const body=el("div"); let cur="pend", q="";
  const sel=el("select",{class:"txt",style:"max-width:320px",onchange:e=>{cur=e.target.value;draw();}},
    ...Object.keys(LIST_NAMES).filter(k=>!IMEDIATO[k]).map(k=>el("option",{value:k,...(k===cur?{selected:""}:{})},LIST_NAMES[k])));
  const search=el("input",{class:"txt",placeholder:"Buscar…",style:"max-width:240px;margin-left:8px",oninput:e=>{q=norm(e.target.value);draw();}});
  const csv=el("button",{class:"btn small",style:"margin-left:8px",onclick:()=>{
    const rows=[["lista","texto","citacoes","ultima_vez","na_lista"]];
    Object.keys(LIST_NAMES).forEach(k=>{ const nks=new Set(); Object.values(SHARED.reg).forEach(p=>Object.keys((p&&p[k])||{}).forEach(x=>nks.add(x)));
      nks.forEach(nk=>{ const t=regTotal(k,nk); rows.push([LIST_NAMES[k],t.t,t.n,t.l?new Date(t.l).toISOString():"",(S.lists[k]||[]).some(x=>norm(x)===nk)?"sim":"não"]); }); });
    const txt=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n");
    download("registro_textos_"+todayISO()+".csv",new Blob(["\ufeff"+txt],{type:"text/csv"}));
  }},"Exportar CSV");
  const holder=el("div",{style:"margin-top:10px"});
  body.append(el("p",{class:"hint"},"Tudo o que é digitado nas listas fica registrado aqui, mesmo sem entrar na lista de sugestões. O texto passa a ser sugerido quando for citado "+THRESH+" vezes. Nomes de pacientes não são registrados."),
    el("div",{},sel,search,csv),holder);
  function draw(){
    holder.innerHTML="";
    const nks=new Set(); Object.values(SHARED.reg).forEach(p=>Object.keys((p&&p[cur])||{}).forEach(x=>nks.add(x)));
    const items=[...nks].map(nk=>Object.assign({nk},regTotal(cur,nk))).filter(x=>!q||x.nk.includes(q)).sort((a,b)=>b.n-a.n||b.l-a.l).slice(0,300);
    if(!items.length){ holder.append(el("p",{class:"hint"},"Nada registrado nesta lista ainda.")); return; }
    items.forEach(x=>{
      const inList=S.lists[cur].some(y=>norm(y)===x.nk);
      holder.append(el("div",{class:"list-item"},
        el("div",{style:"flex:1"},el("b",{},x.t),el("div",{class:"hint",style:"margin:0"},x.n+" citaç"+(x.n===1?"ão":"ões")+(x.l?" · última em "+new Date(x.l).toLocaleDateString("pt-BR"):"")+(inList?" · já está na lista":""))),
        inList?null:el("button",{class:"btn small",onclick:()=>{ addToList(cur,x.t); draw(); }},"Adicionar à lista")));
    });
  }
  draw(); openModal("Registro de textos digitados",body);
}
function addToList(key,name){
  name=name.replace(/\s+/g," ").trim(); if(!name) return null;
  const L=S.lists[key]; const hit=L.find(x=>norm(x)===norm(name));
  if(hit) return hit;
  L.push(name); L.sort((a,b)=>a.localeCompare(b,"pt-BR",{sensitivity:"base"})); save();
  return name;
}

/* ============ Seletor com lista que aprende ============ */
/* opts: {key, get(), set(arr|str), single, placeholder} */
function picker(opts){
  const host=el("div",{class:"picker"});
  const chips=el("span",{style:"display:contents"});
  const input=el("input",{type:"text",placeholder:opts.placeholder||"Clique para escolher ou digitar",autocomplete:"off"});
  const dd=el("div",{class:"dd",hidden:""});
  host.append(chips,input,dd);
  let active=-1, shown=[];
  const selectedList=()=> opts.single ? (opts.get()?[opts.get()]:[]) : opts.get();

  function renderChips(){
    chips.innerHTML="";
    if(opts.single){ if(document.activeElement!==input) input.value=opts.get()||""; return; }
    opts.get().forEach((v,i)=>{
      chips.append(el("span",{class:"chip"},v,el("button",{type:"button","aria-label":"Remover "+v,
        onmousedown:e=>e.preventDefault(),
        onclick:e=>{ e.stopPropagation(); const a=opts.get().slice(); a.splice(i,1); opts.set(a); renderChips(); renderDD(); }},"×")));
    });
  }
  function renderDD(){
    const q=input.value; const nq=norm(q);
    const taken=opts.single?[]:opts.get().map(norm);
    shown=S.lists[opts.key].filter(x=>!taken.includes(norm(x)) && (!nq||norm(x).includes(nq)));
    dd.innerHTML="";
    shown.forEach((x,i)=>dd.append(el("div",{class:"opt"+(i===active?" on":""),
      onmousedown:e=>{e.preventDefault(); pick(x);}},x)));
    const exact=S.lists[opts.key].some(x=>norm(x)===nq);
    if(nq && !exact) dd.append(el("div",{class:"opt new",onmousedown:e=>{e.preventDefault(); pick(q,true);}},
      `Usar "${q.trim()}"`));
    if(!shown.length && !(nq&&!exact)) dd.append(el("div",{class:"none"},"Nenhum item disponível"));
    dd.hidden=false;
  }
  function pick(v){
    const name=learn(opts.key,v); if(!name) return;
    if(opts.single){ opts.set(name); input.value=name; dd.hidden=true; input.blur(); }
    else{ const a=opts.get().slice(); if(!a.some(x=>norm(x)===norm(name))) a.push(name); opts.set(a);
      input.value=""; active=-1; renderChips(); renderDD(); input.focus(); }
    afterChange();
  }
  host.addEventListener("click",()=>input.focus());
  input.addEventListener("focus",()=>{ active=-1; if(opts.single) input.select(); renderDD(); });
  input.addEventListener("input",()=>{ active=-1; renderDD(); });
  input.addEventListener("blur",()=>{
    dd.hidden=true;
    if(opts.single){ // texto digitado sem confirmar: aceita como novo item
      const v=input.value.trim();
      if(!v){ if(opts.get()){ opts.set(""); afterChange(); } }
      else if(norm(v)!==norm(opts.get()||"")){ const n=learn(opts.key,v); opts.set(n); input.value=n; afterChange(); }
    } else if(input.value.trim()){        // texto digitado sem confirmar: vira item (e fica registrado)
      const n=learn(opts.key,input.value);
      if(n){ const a=opts.get().slice(); if(!a.some(x=>norm(x)===norm(n))) a.push(n); opts.set(a); input.value=""; renderChips(); afterChange(); }
    }
  });
  input.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); active=Math.min(active+1,shown.length-1); renderDD(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); active=Math.max(active-1,0); renderDD(); }
    else if(e.key==="Enter"){ e.preventDefault();
      if(active>=0&&shown[active]) pick(shown[active]);
      else if(input.value.trim()) pick(input.value);
    }
    else if(e.key==="Escape"){ dd.hidden=true; input.value=""; input.blur(); }
    else if(e.key==="Backspace" && !input.value && !opts.single){ const a=opts.get().slice(); if(a.length){a.pop(); opts.set(a); renderChips(); renderDD(); afterChange();} }
  });
  renderChips();
  return host;
}

        el("div",{},el("label",{class:"lbl"},"Unidade"),el("input",{class:"txt",type:"text",placeholder:"ex.: ng/mL",value:e.unidade||"",oninput:ev=>{e.unidade=ev.target.value;afterChange();}})),
        el("button",{class:"x-btn",type:"button","aria-label":"Remover exame",onclick:()=>{L.exames.splice(i,1);afterChange();renderLab();}},"×")));
      e.res.forEach((r,k)=>{
        box.append(el("div",{class:"lab-res"},
          el("input",{class:"txt",type:"date","aria-label":"Data do resultado",value:r.data||"",oninput:ev=>{r.data=ev.target.value;afterChange();updTrend();}}),
          el("input",{class:"txt",type:"text","aria-label":"Resultado",placeholder:"Resultado",value:r.valor||"",oninput:ev=>{r.valor=ev.target.value;afterChange();updTrend();}}),

        el("div",{},el("label",{class:"lbl"},"Exame"),picker({key:"imagem",single:true,placeholder:"Escolher exame",get:()=>x.nome,set:v=>x.nome=v})),
        el("div",{},el("label",{class:"lbl"},"Data"),el("input",{class:"txt",type:"date",value:x.data||"",oninput:e=>{x.data=e.target.value;afterChange();}})),
        el("div",{},el("label",{class:"lbl"},"Principal achado"),picker({key:"achado",single:true,placeholder:"Escolher ou digitar o achado",get:()=>x.achado,set:v=>x.achado=v})),
        el("button",{class:"x-btn",type:"button","aria-label":"Remover exame",onclick:()=>{b.imagem.splice(i,1);afterChange();renderImg();}},"×")));
    });
    imgCard.append(el("button",{class:"btn",type:"button",onclick:()=>{b.imagem.push({nome:"",data:S.data,achado:""});afterChange();renderImg();}},"+ Adicionar exame"));

  renderImg();
  ed.append(listCard("Pendências","pend","pend","Clique para ver as pendências ou digite uma nova"));
  ed.append(listCard("Condutas","condutas","condutas","Clique para ver as condutas ou digite uma nova"));

  // registro da alteração
  const respRow=el("div",{class:"resp-row"},
    picker({key:"medico",single:true,placeholder:"Escolher ou digitar o nome",get:()=>b.resp,set:v=>{b.resp=v; if(v) S.ultimoResp=v;}}));
  if(S.ultimoResp && !b.resp) respRow.append(el("button",{class:"btn small",type:"button",onclick:()=>{b.resp=S.ultimoResp;afterChange();renderEditor();}},"Usar "+S.ultimoResp));
  ed.append(el("div",{class:"card"},el("h3",{},"Registro da alteração"),

/* ============ Documento do passômetro (impressão e Word) ============ */
const DOC_CSS=`
.pt{font-family:Calibri,Arial,sans-serif;color:#000}
.pt h1{font-size:14pt;margin:0 0 4pt}
.pt .sub{font-size:10pt;margin:0 0 6pt}
.pt table{width:100%;border-collapse:collapse;table-layout:fixed}
.pt th{background:#d9e6e3;border:1px solid #444;font-size:7.5pt;padding:3pt;text-align:left}
.pt td{border:1px solid #444;font-size:7.5pt;padding:3pt;vertical-align:top;word-wrap:break-word}
.pt tr{page-break-inside:avoid}
.pt thead{display:table-header-group}
.pt .vago td{color:#666}
.pt .b{font-weight:bold}
.pt .atb{margin:0 0 2pt}
`;
function docHead(st,logoSrc,title){
  const titulo=`<h1>${esc(title)} – ${esc(st.unit)}</h1><p class="sub">Data: <b>${fmtDate(st.data,true)}</b></p>`;
  if(st.logo&&logoSrc){
    const h=44, w=Math.round(h*(st.logoRatio||1));
    return `<table class="hd" style="width:auto;table-layout:auto;border:none;border-collapse:collapse"><tr><td style="border:none;padding:0 12pt 0 0;vertical-align:middle"><img src="${logoSrc}" height="${h}" width="${w}" style="height:${h}px;width:${w}px"></td><td style="border:none;padding:0;vertical-align:middle">${titulo}</td></tr></table><p style="margin:0 0 4pt">&nbsp;</p>`;
  }
  return titulo;
}
function devTxt(b,ref){
  return devEntries(b,ref).map(x=>{
    const txt=esc(x.l+(x.sit?" ("+x.sit+")":"")+(x.data?` – ${fmtDate(x.data)}, D${x.d}`:""));
    return (x.data&&x.d>ALERT_DIAS)?`<b style="color:#b00000">⚠ ${txt}</b>`:txt;
  }).join("<br>");
}
function docBodyEnf(st,logoSrc){
  const ref=st.data; logoSrc=logoSrc||st.logo;
  const list=a=>(a||[]).map(esc).join("; ");
  const exm=b=>(b.exm||[]).filter(x=>x.nome).map(x=>{
    const quando=(x.data?fmtDate(x.data)+(x.hora?" "+esc(x.hora):""):(x.hora?esc(x.hora):""));
    return `<div class="atb"><b>${esc(x.nome)}</b>${quando?" – "+quando:""}${x.anest?" · <b>com suporte anestésico</b>":""}${x.feito?" · <b>realizado ✔</b>":""}</div>`;
  }).join("");
  const proc=b=>(b.proc||[]).filter(x=>x.nome).map(x=>{
    const quando=(x.data?fmtDate(x.data)+(x.hora?" "+esc(x.hora):""):(x.hora?esc(x.hora):""));
    return `<div class="atb"><b>${esc(x.nome)}</b>${quando?" – "+quando:""}${x.medico?" · "+esc(x.medico):""}${x.feito?" · <b>realizado ✔</b>":""}</div>`;
  }).join("");
  const rows=st.beds.filter(b=>!b.extra||b.ativo).map(b=>{
    const lab=b.extra?`Extra ${b.id.slice(1)}${b.local?"<br>"+esc(b.local):""}`:b.id.slice(1).padStart(2,"0");
    const dv=devTxt(b,ref);
    const has=b.nome||precTxt(b)||b.problemas.length||b.pend.length||(b.exm||[]).length||(b.proc||[]).length||dv;
    if(!has) return `<tr class="vago"><td class="b">${lab}</td><td colspan="6">Vago</td></tr>`;
    const id=`<span class="b">${esc(b.nome)||"—"}</span>${b.idade?"<br>"+esc(b.idade)+" anos":""}${b.admissao?"<br>Adm.: "+fmtDate(b.admissao,true):""}${b.plano?"<br>"+esc(b.plano):""}${precHtml(b)}`;
    return `<tr><td class="b">${lab}</td><td>${id}</td><td>${list(b.problemas)}</td><td>${dv}</td><td>${exm(b)}</td><td>${proc(b)}</td><td>${list(b.pend)}</td></tr>`;
  }).join("");
  return `<div class="pt">${docHead(st,logoSrc,"Passômetro de Enfermagem")}
<table><thead><tr>
<th style="width:5%">Leito</th><th style="width:13%">Paciente</th><th style="width:15%">Problemas / Hipóteses Diagnósticas</th><th style="width:15%">Dispositivos</th><th style="width:18%">Exames de Imagem pendentes / realizados</th><th style="width:18%">Procedimentos pendentes / realizados</th><th style="width:16%">Atualizações, Condutas, Pendências e Observações</th>
</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function docBody(st,logoSrc){
  if(st.svc==="enf") return docBodyEnf(st,logoSrc);
  const ref=st.data; logoSrc=logoSrc||st.logo;
  const dev=b=>devTxt(b,ref);
  const atb=b=>b.atb.filter(a=>a.nome).map(a=>{
    const d=daysSince(a.ini,ref), ai=atbInfo(a,ref);
    const per=a.ini||a.fim?` (${fmtDate(a.ini)||"?"} a ${fmtDate(a.fim)||"?"}${ai.fin?", finalizado · "+ai.n+" D":(d>0?", D"+d:"")})`:"";
    return `<div class="atb"><b>${esc(a.nome)}</b>${esc(per)}</div>`;
  }).join("");
  const cul=b=>(b.culturas||[]).filter(c=>c.sitio||c.germe).map(c=>
    `<div class="atb">${c.data?fmtDate(c.data)+" ":""}<b>${esc(c.sitio||"Cultura")}</b>: ${c.germe?esc(c.germe):"<i>aguardando</i>"}${(c.perfil&&c.perfil.length)?" – "+esc(c.perfil.join(", ")):""}</div>`).join("");
  const img=b=>(b.imagem||[]).map(x=>typeof x==="string"?{nome:x}:x).filter(x=>x.nome).map(x=>
    `<div class="atb"><b>${esc(x.nome)}</b>${x.data?" ("+fmtDate(x.data)+")":""}${x.achado?": "+esc(x.achado):""}</div>`).join("");
  const list=a=>a.map(esc).join("; ");
  const reg=b=>(b.resp||b.upd)?`${esc(b.resp)||"—"}${b.upd?"<br>"+new Date(b.upd).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):""}`:"";
  const vis=st.beds.filter(b=>!b.extra||b.ativo), anyLab=vis.some(labEspOn), NC=anyLab?10:9;
  const rows=st.beds.filter(b=>!b.extra||b.ativo).map(b=>{
    const lab=b.extra?`Extra ${b.id.slice(1)}${b.local?"<br>"+esc(b.local):""}`:b.id.slice(1).padStart(2,"0");
    const has=b.nome||precTxt(b)||b.problemas.length||b.atb.length||(b.culturas||[]).length||labEspTxt(b)||b.imagem.length||b.pend.length||b.condutas.length||dev(b);
    if(!has) return `<tr class="vago"><td class="b">${lab}</td><td colspan="${NC-1}">Vago</td></tr>`;
    const id=`<span class="b">${esc(b.nome)||"—"}</span>${b.idade?"<br>"+esc(b.idade)+" anos":""}${b.admissao?"<br>Adm.: "+fmtDate(b.admissao,true):""}${b.plano?"<br>"+esc(b.plano):""}${precHtml(b)}`;
    return `<tr><td class="b">${lab}</td><td>${id}</td><td>${list(b.problemas)}</td><td>${dev(b)}</td><td>${atb(b)}</td><td>${cul(b)}</td>${anyLab?`<td>${labEspTxt(b)}</td>`:""}<td>${img(b)}</td><td>${list(b.pend)}</td><td>${list(b.condutas)}</td></tr>`;
  }).join("");
  const hdr=docHead(st,logoSrc,"Passômetro");
  return `<div class="pt">${hdr}
<table><thead><tr>
<th style="width:4%">Leito</th><th style="width:${anyLab?10:11}%">Paciente</th><th style="width:${anyLab?11:12}%">Problemas</th><th style="width:${anyLab?10:11}%">Dispositivos</th>
<th style="width:${anyLab?11:12}%">Antibióticos</th><th style="width:${anyLab?12:14}%">Culturas</th>${anyLab?'<th style="width:10%">Laboratoriais</th>':""}<th style="width:${anyLab?12:13}%">Imagem</th><th style="width:10%">Pendências</th><th style="width:${anyLab?10:13}%">Condutas</th>
</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function doPrint(){
  $("#printArea").innerHTML=`<style>${DOC_CSS}</style>`+docBody(S);
  window.print();
}
function download(name,blob){
  const a=el("a",{href:URL.createObjectURL(blob),download:name}); document.body.append(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
function wordHtml(st,logoSrc){
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>Passômetro</title>

function wrap76(t){ return t.replace(/(.{76})/g,"$1\r\n"); }
function wordFile(st){
  const m=st.logo&&st.logo.match(/^data:image\/[a-z+]+;base64,(.*)$/);
  if(!m) return "\ufeff"+wordHtml(st);
  const html=wordHtml(st,"logo.png"), B="----=_NextPart_passometro_001";
  const h64=btoa(unescape(encodeURIComponent(html)));
  return "MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary=\""+B+"\"; type=\"text/html\"\r\n\r\n"+
    "--"+B+"\r\nContent-Type: text/html; charset=\"utf-8\"\r\nContent-Transfer-Encoding: base64\r\nContent-Location: file:///C:/passometro/passometro.htm\r\n\r\n"+wrap76(h64)+"\r\n\r\n"+
    "--"+B+"\r\nContent-Type: image/png\r\nContent-Transfer-Encoding: base64\r\nContent-Location: file:///C:/passometro/logo.png\r\n\r\n"+wrap76(m[1])+"\r\n\r\n--"+B+"--\r\n";
}
function saveWord(st,name){ download(name,new Blob([wordFile(st)],{type:"application/msword"})); }

function logoModal(){
  const prev=el("div",{style:"margin:12px 0;padding:12px;border:1px dashed var(--line);border-radius:8px;min-height:60px"});
  const draw=()=>{ prev.innerHTML=""; prev.append(S.logo?el("img",{src:S.logo,style:"max-height:80px;max-width:100%"}):el("p",{class:"hint",style:"margin:0"},"Nenhuma logo definida.")); };
  draw();
  const file=el("input",{type:"file",accept:"image/*",hidden:""});
  file.addEventListener("change",()=>{
    const f=file.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const k=Math.min(1,200/img.height,600/img.width);
        const w=Math.max(1,Math.round(img.width*k)), h=Math.max(1,Math.round(img.height*k));
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        S.logo=c.toDataURL("image/png"); S.logoRatio=w/h; save(); draw(); toast("Logo salva");
      };
      img.onerror=()=>alert("Não foi possível ler essa imagem. Use um arquivo PNG ou JPG.");
      img.src=r.result;
    };
    r.readAsDataURL(f); file.value="";
  });
  const body=el("div",{},
    el("p",{class:"hint"},"A logo aparece no topo do passômetro impresso e do arquivo Word. Use uma imagem PNG ou JPG."),
    prev,
    el("div",{style:"display:flex;gap:10px"},
      el("button",{class:"btn primary",onclick:()=>file.click()},"Escolher imagem"),
      el("button",{class:"btn danger",onclick:()=>{ S.logo=""; S.logoRatio=0; save(); draw(); }},"Remover logo")),
    file);
  openModal("Logo do passômetro",body);
}

/* ============ Transferência de leito ============ */
function bedHasPatient(b){
  return !!(b.nome||b.problemas.length||b.atb.length||(b.culturas||[]).length||b.imagem.length||b.pend.length||b.condutas.length||(b.exm||[]).length||(b.proc||[]).length||labEspTxt(b)||((b.disp&&b.disp.outros)||[]).length||DEVS.some(([k])=>devOn(b,k)));
}
function movePatient(a,b,swap){
  const ia=a.id, ib=b.id, now=Date.now();
  SVCS.forEach(k=>{                               /* dados próprios de cada passômetro */
    const x=SV[k].beds.find(t=>t.id===ia), y=SV[k].beds.find(t=>t.id===ib); if(!x||!y) return;
    const px={}, py={}; SVC_KEYS.forEach(f=>{ px[f]=x[f]; py[f]=y[f]; });
    const blank=newBed(ia,x.extra);
    SVC_KEYS.forEach(f=>{ y[f]=px[f]; x[f]=swap?py[f]:blank[f]; });
    x.upd=y.upd=now;
  });
  const A=pacOf(ia), B=pacOf(ib), pa={}, pb={};     /* identificação, problemas e dispositivos (valem para os 3 módulos) */
  PAC_MOVE.forEach(f=>{ pa[f]=A[f]; pb[f]=B[f]; });
  const blankP=defaultPac(ia);
  PAC_MOVE.forEach(f=>{ B[f]=pa[f]; A[f]=swap?pb[f]:blankP[f]; });
}
function clearBedAll(id){
  SVCS.forEach(k=>{
    const bd=SV[k].beds.find(x=>x.id===id); if(!bd) return;
    const nb=newBed(id,bd.extra); SVC_KEYS.forEach(f=>{ bd[f]=nb[f]; }); bd.upd=Date.now();
  });
  const p=pacOf(id), d=defaultPac(id); PAC_MOVE.forEach(f=>{ p[f]=d[f]; });
}
function transferModal(src){
  const opts=S.beds.filter(x=>x.id!==src.id);
  const status=x=>(x.extra&&!x.ativo)?"não utilizado":(bedHasPatient(x)?(x.nome||"paciente sem nome")+" (ocupado)":"vago");
  const sel=el("select",{class:"txt","aria-label":"Leito de destino"},
    ...opts.map(x=>el("option",{value:x.id},bedLabel(x)+(x.extra&&x.local?" · "+x.local:"")+" — "+status(x))));
  const info=el("div",{style:"margin-top:12px"});
  const go=el("button",{class:"btn primary",type:"button"},"Transferir paciente");
  let swapChk=null, localIn=null, close;
  const dest=()=>opts.find(x=>x.id===sel.value);
  function draw(){
    info.innerHTML=""; const d=dest(); swapChk=null; localIn=null;
    if(d.extra){
      localIn=el("input",{class:"txt",type:"text",value:d.local||"",placeholder:"Localização real (ex.: Sala de recuperação)"});
      info.append(el("label",{class:"lbl"},"Localização do "+bedLabel(d)),localIn);
    }
    if(bedHasPatient(d)&&!(d.extra&&!d.ativo)){
      swapChk=true;
      info.append(el("div",{class:"alert-banner",style:"margin:12px 0 0;background:#fff6e5;border-color:#f0cf8a;color:#7a4b00"},
        `O ${bedLabel(d)} está ocupado${d.nome?" por "+d.nome:""}. Os dois pacientes vão trocar de lugar: ${d.nome||"o paciente dele"} irá para o ${bedLabel(src)}.`));
    }
    go.textContent=swapChk?"Trocar os dois de lugar":"Transferir paciente";
  }
  sel.addEventListener("change",draw);
  go.addEventListener("click",()=>{ try{
    const d=dest(), swap=!!swapChk;
    if(d.extra){ d.ativo=true; d.local=localIn?localIn.value.trim():d.local; }
    movePatient(src,d,swap);
    if(src.extra&&!swap){ src.ativo=false; src.local=""; }
    selected=d.id; save();
    const msg=swap?`Pacientes trocados entre ${bedLabel(src)} e ${bedLabel(d)}`:`Paciente transferido do ${bedLabel(src)} para o ${bedLabel(d)}`;
    close(); toast(msg);
  }catch(err){ alert("Não foi possível transferir: "+err.message); } });
  const body=el("div",{},
    el("p",{class:"hint"},`Move todas as informações do ${bedLabel(src)}${src.nome?" ("+src.nome+")":""} para o leito escolhido, nos dois passômetros (médico e enfermagem) e no POCUS: identificação, problemas, dispositivos e datas, e os dados próprios de cada passômetro.`
      +(src.extra?" Como este é um leito extra, ele ficará como não utilizado após a transferência.":"")),
    el("label",{class:"lbl"},"Leito de destino"),sel,info,
    el("div",{style:"margin-top:16px;display:flex;gap:10px"},go));
  draw(); close=openModal("Transferir de leito",body);
}

function restoreArchive(a){
  const copy=JSON.parse(JSON.stringify(a.beds));
  copy.forEach(b=>{ const q=pacOf(b.id); PAC_KEYS.forEach(k=>{ if(k in b) q[k]=b[k]; }); q.disp=Object.assign(defaultDisp(),q.disp||{}); });
  S.beds=S.beds.map(cur=>{ const o=Object.assign(newBed(cur.id,cur.extra),copy.find(x=>x.id===cur.id)||{}); PAC_KEYS.forEach(k=>{ delete o[k]; }); return fixBed(o); });
  S.data=a.data;
}
function archiveCurrent(st,ts){
  st=st||S;
  st.archive.unshift({ts:ts||Date.now(),data:st.data,beds:st.beds.map(b=>{ const c=JSON.parse(JSON.stringify(b)), q=pacOf(b.id); PAC_KEYS.forEach(k=>{ c[k]=JSON.parse(JSON.stringify(q[k])); }); return c; })});
  st.archive=st.archive.slice(0,60);
}
/* Virada automática do dia: arquiva o passômetro da data anterior e passa para a data de hoje (igual a “Novo plantão”).
   O carimbo do arquivo é fixo para cada data (23:59:59 do dia), então dois computadores não geram arquivos duplicados. */
function autoPlantao(){
  const hoje=todayISO(); let mudou=false;
  SVCS.forEach(k=>{
    const st=SV[k]; if(!st||!/^\d{4}-\d{2}-\d{2}$/.test(st.data||"")||st.data>=hoje) return;
    if(st.beds.some(b=>bedHasPatient(b))&&!st.archive.some(a=>a.data===st.data)){
      const [y,m,d]=st.data.split("-").map(Number);
      archiveCurrent(st,new Date(y,m-1,d,23,59,59).getTime());
    }
    st.data=hoje; mudou=true;
  });
  if(!mudou) return;
  if(view==="med"||view==="enf"){ $("#hData").value=S.data; }
  save();
  if(!(typeof editingNow==="function"&&editingNow())){ try{ rerenderActive(); }catch(e){} }
}

function importBackup(file){
  if(!file) return;
  const r=new FileReader();
  r.onerror=()=>alert("Não foi possível ler o arquivo escolhido.");
  r.onload=()=>{
    let d;
    try{ d=JSON.parse(String(r.result).replace(/^\uFEFF/,"")); }
    catch(e){ alert("Não foi possível ler esse arquivo como backup. Escolha o arquivo .json gerado em Backup > Exportar backup."); return; }
    try{
      if(d&&d.parts&&!d.beds&&!d.med){ /* formato do servidor (estado.json ou backup_*.json) */
        const prevSV={med:SV.med,enf:SV.enf}, prevSH=Object.assign({},SHARED);
        buildAll(null);
        Object.keys(d.parts).sort((x,y)=>partPri(x)-partPri(y)).forEach(n=>{ const q=d.parts[n]; applyPart(n,(q&&q.value!==undefined)?q.value:(q&&q.json?JSON.parse(q.json):undefined)); });
        d=snapshotAll();
        SV.med=prevSV.med; SV.enf=prevSV.enf; Object.assign(SHARED,prevSH);
      }
      const med=d&&(d.med||(Array.isArray(d.beds)?d:null));
      if(!med||!Array.isArray(med.beds)||!d.lists) throw new Error("o arquivo não tem a estrutura de um backup do passômetro");
      const n=d.pac?Object.values(d.pac).filter(q=>q&&q.nome).length:med.beds.filter(b=>b&&b.nome).length;
      if(!confirm(`Importar este backup (${n} paciente(s) nos leitos)?\n\nOs dados atuais de TODOS os serviços serão substituídos.`)) return;
      const svc=S.svc, ur=SHARED.ultimoResp;
      const rg=SHARED.reg; buildAll(d); SHARED.ultimoResp=ur; const rg2=SHARED.reg; SHARED.reg=rg; Object.keys(rg2).forEach(id=>regMerge(SHARED.reg[id]||(SHARED.reg[id]={}),rg2[id])); S=SV[svc]; selected="L1"; SEL.med="L1"; SEL.enf="L1";
      if(NET){ Object.keys(pending).forEach(k=>delete pending[k]); renderBanner(); }
      $("#hUnit").value=S.unit; $("#hData").value=S.data;
      save(); renderNav(); renderEditor();
      document.querySelectorAll(".overlay").forEach(o=>o.remove());
      toast("Backup importado ("+n+" paciente(s))");
    }catch(e){ alert("Não foi possível importar: "+e.message); }
  };
  r.readAsText(file);
}

let NET=false, netDown=false, needRender=false, tickN=0, pushing=false, again=false, netUser="";
const CID=Math.random().toString(36).slice(2)+Date.now().toString(36);
const versions={}, synced={}, pending={};

const PFX={med:{bed:"bed:",arch:"arch:",meta:"meta"},enf:{bed:"nbed:",arch:"narch:",meta:"nmeta"}};
function svcOfPart(n){
  for(const k of SVCS){ const p=PFX[k]; if(n===p.meta||n.startsWith(p.bed)||n.startsWith(p.arch)) return k; }
  return null;
}
function partPri(p){ return p.startsWith("pac:")?0:p.startsWith("bed:")?1:p.startsWith("nbed:")?2:3; }
function isImmutable(n){ return /^(arch:|narch:|pocus:|ped:)/.test(n); }
function openPart(){ return (view==="med"||view==="enf")?PFX[S.svc].bed+selected:null; }
function isOpen(n){
  if(n===openPart()) return true;
  if(view==="med"||view==="enf") return n==="pac:"+selected;
  if(view==="pocus") return !!(pdraft&&pdraft.leito&&n==="pac:"+pdraft.leito);
  return false;
}
function rerenderActive(){
  if(editingNow()){ needRender=true; return; }
  if(view==="pocus") renderPocus(); else if(view==="med"||view==="enf") renderEditor();
}
function partNames(){
  const out=["logo",...Object.keys(SHARED.lists).map(k=>"list:"+k),...SHARED.pocus.map(r=>"pocus:"+r.ts),...SHARED.ped.map(r=>"ped:"+r.ts),...SV.med.beds.map(b=>"pac:"+b.id),...Object.keys(Object.assign({[RID]:1},SHARED.reg)).map(r=>"reg:"+r)];
  SVCS.forEach(k=>{ const st=SV[k], p=PFX[k]; out.push(p.meta,...st.archive.map(a=>p.arch+a.ts),...st.beds.map(b=>p.bed+b.id)); });
  return out;
}
function getPart(n){
  if(n==="logo") return {logo:SHARED.logo||"",logoRatio:SHARED.logoRatio||0};
  if(n.startsWith("list:")) return SHARED.lists[n.slice(5)];
  if(n.startsWith("pac:")) return pacOf(n.slice(4));
  if(n.startsWith("reg:")) return SHARED.reg[n.slice(4)]||(SHARED.reg[n.slice(4)]={});
  if(n.startsWith("pocus:")) return SHARED.pocus.find(r=>String(r.ts)===n.slice(6));
  if(n.startsWith("ped:")) return SHARED.ped.find(r=>String(r.ts)===n.slice(4));
  const k=svcOfPart(n); if(!k) return undefined;
  const st=SV[k], p=PFX[k];
  if(n===p.meta) return {unit:st.unit,data:st.data};
  if(n.startsWith(p.arch)) return st.archive.find(a=>String(a.ts)===n.slice(p.arch.length));
  if(n.startsWith(p.bed)) return st.beds.find(b=>b.id===n.slice(p.bed.length));
}
function serialize(n){ return isImmutable(n)?"1":JSON.stringify(getPart(n)); }
function applyPart(n,v){
  if(n==="logo"){ SHARED.logo=v.logo||""; SHARED.logoRatio=v.logoRatio||0; return; }
  if(n.startsWith("list:")){ SHARED.lists[n.slice(5)]=v; return; }
  if(n.startsWith("reg:")){ SHARED.reg[n.slice(4)]=(v&&typeof v==="object")?v:{}; return; }
  if(n.startsWith("pac:")){ const id=n.slice(4), q=Object.assign(defaultPac(id),v); q.disp=Object.assign(defaultDisp(),q.disp||{}); SHARED.pac[id]=q; return; }
  if(n.startsWith("ped:")){
    const r=Object.assign({},v), i=SHARED.ped.findIndex(x=>x.ts===r.ts);
    if(i>=0) SHARED.ped[i]=r; else SHARED.ped.push(r);
    SHARED.ped.sort((a,b)=>b.ts-a.ts); return;
  }
  if(n.startsWith("pocus:")){
    const r=Object.assign({},v), i=SHARED.pocus.findIndex(x=>x.ts===r.ts);
    if(i>=0) SHARED.pocus[i]=r; else SHARED.pocus.push(r);
    SHARED.pocus.sort((a,b)=>b.ts-a.ts); return;
  }
  if(n==="archive"){ SV.med.archive=(v||[]).map(a=>{ a.beds=(a.beds||[]).map(fixArch); return a; }); return; }  /* formato antigo (servidor local) */
  const k=svcOfPart(n); if(!k) return;
  const st=SV[k], p=PFX[k];
  if(n===p.meta){ st.unit=v.unit||st.unit; st.data=v.data||st.data; }
  else if(n.startsWith(p.arch)){
    const e=Object.assign({},v); e.beds=(e.beds||[]).map(fixArch);
    const i=st.archive.findIndex(a=>a.ts===e.ts); if(i>=0) st.archive[i]=e; else st.archive.push(e);
    st.archive.sort((a,b)=>b.ts-a.ts);
  }
  else if(n.startsWith(p.bed)){ const i=st.beds.findIndex(b=>b.id===n.slice(p.bed.length)); if(i>=0) st.beds[i]=fixBed(Object.assign({},v)); }
}
function labelOf(n){
  if(n.startsWith("list:")) return "Lista “"+(LIST_NAMES[n.slice(5)]||n.slice(5))+"”";
  if(n.startsWith("pocus:")) return "Histórico do POCUS";

function isPristine(n){

}
function unionList(a,b){

}

async function pushDirty(){
  if(!NET) return;
  if(pushing){ again=true; return; }
  pushing=true; let sent=false;
  try{
    const names=partNames();
    for(const n of names){
      if(pending[n]&&pending[n].conflict) continue;
      const js=serialize(n);
      if(synced[n]===js) continue;
      if(n.startsWith("pac:")&&versions[n]===undefined&&isPristine(n)){ synced[n]=js; continue; }   /* leito vazio e nunca gravado */
      let r;
      try{ r=await FB.put(n,versions[n]||0,getPart(n),netUser,CID); }catch(e){ netError(e); return; }
      if(r.conflict){
        const cur=r.current;
        if(cur&&JSON.stringify(cur.value)===JSON.stringify(getPart(n))){ versions[n]=cur.v; synced[n]=js; continue; }
        if(cur&&isPristine(n)){ applyRemote({part:n,v:cur.v,value:cur.value,by:cur.by}); continue; }
        if(isImmutable(n)&&cur){ applyRemote({part:n,v:cur.v,value:cur.value,by:cur.by}); continue; }   /* arquivo/histórico já gravado por outro computador */
        if(n.startsWith("reg:")&&cur){ versions[n]=cur.v; regMerge(getPart(n),cur.value); regPromoteAll(); again=true; continue; }
        if(n.startsWith("list:")&&cur){ versions[n]=cur.v; S.lists[n.slice(5)]=unionList(S.lists[n.slice(5)],cur.value); again=true; continue; }
        if(cur){ pending[n]={ev:{part:n,v:cur.v,value:cur.value,by:cur.by},conflict:true}; renderBanner(); }
        continue;
      }
      versions[n]=r.v; synced[n]=js; sent=true;
    }
    for(const n of Object.keys(synced)){           /* histórico apagado localmente */
      if(isImmutable(n)&&!names.includes(n)){
        try{ await FB.remove(n); delete synced[n]; delete versions[n]; sent=true; }catch(e){ netError(e); return; }
      }
    }
    setNet(true,sent);
  } finally { pushing=false; if(again){ again=false; pushDirty(); } }
}
function applyRemote(ev){
  versions[ev.part]=ev.v; applyPart(ev.part,ev.value); synced[ev.part]=serialize(ev.part); delete pending[ev.part];
  renderBanner();
  if(view==="med"||view==="enf"){
    renderNav();
    if(ev.part===PFX[S.svc].meta){ $("#hUnit").value=S.unit; $("#hData").value=S.data; }
    if(ev.part===PFX[S.svc].meta||isOpen(ev.part)) rerenderActive();
  } else if(view==="pocus"&&(ev.part.startsWith("pac:")||ev.part.startsWith("pocus:"))) rerenderActive();
  else if(view==="hub") renderHub();
}
function onRemote(ev){
  if(ev.value==null) return;
  if(ev.cid&&ev.cid===CID) return;
  if((versions[ev.part]||0)>=ev.v) return;
  const dirty=synced[ev.part]!==undefined && serialize(ev.part)!==synced[ev.part];
  if(ev.part.startsWith("reg:")){
    versions[ev.part]=ev.v;
    if(dirty) regMerge(getPart(ev.part),ev.value); else { applyPart(ev.part,ev.value); synced[ev.part]=serialize(ev.part); }
    if(regPromoteAll()) save();
    return;
  }
  if(ev.part.startsWith("list:")){
    const k=ev.part.slice(5); versions[ev.part]=ev.v;
    if(dirty){ SHARED.lists[k]=unionList(SHARED.lists[k]||[],ev.value); save(); }
    else { SHARED.lists[k]=ev.value; synced[ev.part]=serialize(ev.part); }
    return;
  }
  if(dirty||(isOpen(ev.part)&&editingNow())){ pending[ev.part]={ev,conflict:dirty}; renderBanner(); return; }
  applyRemote(ev);
}
function onChange(c){
  if(c.type==="removed"){
    const m=c.part.match(/^(arch:|narch:|pocus:|ped:)(\d+)$/);
    if(m){
      const ts=Number(m[2]);
      if(m[1]==="pocus:") SHARED.pocus=SHARED.pocus.filter(r=>r.ts!==ts);
      else if(m[1]==="ped:") SHARED.ped=SHARED.ped.filter(r=>r.ts!==ts);
      else { const st=SV[m[1]==="arch:"?"med":"enf"]; st.archive=st.archive.filter(a=>a.ts!==ts); }
      delete synced[c.part]; delete versions[c.part];
    }
    return;
  }
  onRemote({part:c.part,v:c.v,value:c.value,by:c.by,cid:c.cid});
}
function flushPending(){
  Object.keys(pending).forEach(k=>{
    const p=pending[k]; if(!p||p.conflict) return;
    if(isOpen(k)&&editingNow()) return;
    if(serialize(k)!==synced[k]) return;
    applyRemote(p.ev);
  });
}
function renderBanner(){
  const bn=$("#netBanner"), keys=Object.keys(pending);
  if(!keys.length){ bn.hidden=true; bn.innerHTML=""; return; }
  const k=keys[0], p=pending[k]; bn.hidden=false; bn.innerHTML="";
  bn.append(el("span",{},`⚠ ${p.ev.by||"Outro usuário"} atualizou: ${labelOf(k)}.${p.conflict?" Suas alterações nesse item ainda não foram salvas.":""}`),
    el("button",{class:"btn small",type:"button",onclick:()=>applyRemote(p.ev)},"Carregar a versão atual"));
  if(p.conflict) bn.append(el("button",{class:"btn small",type:"button",onclick:()=>{ versions[k]=p.ev.v; delete pending[k]; renderBanner(); save(); }},"Manter a minha versão"));
}

/* ---- início da sincronização ---- */
async function netStart(){
  buildAll(null); S=SV.med;
  try{ SHARED.ultimoResp=localStorage.getItem("passometro_ultimoResp")||""; }catch(e){}
  let first=true;
  await new Promise((resolve,reject)=>{
    FB.listen(changes=>{
      if(first){
        first=false;
        const legacy=[];
        changes.slice().sort((x,y)=>partPri(x.part)-partPri(y.part)).forEach(c=>{
          if(c.type!=="removed"&&c.value!=null){
            if(/^n?bed:/.test(c.part)&&PAC_KEYS.some(k=>k in c.value)) legacy.push(c.part);
            versions[c.part]=c.v; applyPart(c.part,c.value);
          }
        });
        const names=partNames();
        Object.keys(versions).forEach(n=>{ if(names.includes(n)) synced[n]=serialize(n); });
        legacy.forEach(n=>{ delete synced[n]; });   /* regrava o leito sem a identificação duplicada */
        resolve(); return;
      }
      changes.forEach(onChange);
    },err=>{ if(first){ first=false; reject(err); } else netError(err); });
  });
  ensurePlanos(); regPromoteAll(); limparHistoricos(); setInterval(limparHistoricos,60000); autoPlantao(); setInterval(autoPlantao,30000);
  setInterval(()=>{ tickN++; if(netDown||tickN%2===0) pushDirty(); flushPending(); if(needRender&&!editingNow()){ needRender=false; rerenderActive(); } },3000);
  window.addEventListener("online",()=>{ setNet(true); pushDirty(); });
  window.addEventListener("offline",()=>setNet(false));
  window.addEventListener("beforeunload",e=>{
    if(partNames().some(n=>!(pending[n]&&pending[n].conflict)&&synced[n]!==serialize(n))){ e.preventDefault(); e.returnValue=""; }
  });
  $("#editor").addEventListener("focusout",()=>setTimeout(()=>{
    if(editingNow()) return; flushPending(); if(needRender){ needRender=false; rerenderActive(); }
  },250));
  $("#pocusApp").addEventListener("focusout",()=>setTimeout(()=>{
    if(editingNow()) return; flushPending(); if(needRender){ needRender=false; rerenderActive(); }
  },250));
  save();
}

const DIAS_HIST=15;
function ultimaViragem(now,soMeiaNoite){ const d=new Date(now); d.setMinutes(0,0,0); d.setHours(!soMeiaNoite&&d.getHours()>=12?12:0); return d.getTime(); }   /* último 00:00 (ou 12:00) */
function pedTemLab(r){ const l=r&&r.d&&r.d.lab; return !!(l&&((l.sel&&l.sel.length)||l.gaso||(l.livres&&l.livres.length))); }
function arqVence(a,now){                 /* plantão arquivado: some às 00:00 do 15º dia depois da data do passômetro */
  let ini; if(a.data&&/^\d{4}-\d{2}-\d{2}$/.test(a.data)){ const [y,m,d]=a.data.split("-").map(Number); ini=new Date(y,m-1,d); } else { ini=new Date(a.ts); ini.setHours(0,0,0,0); }
  const venc=new Date(ini.getFullYear(),ini.getMonth(),ini.getDate()+DIAS_HIST); return now>=venc.getTime();
}
function limparHistoricos(){
  const now=Date.now(), v12=ultimaViragem(now), v00=ultimaViragem(now,true); let mudou=false;
  if(SHARED.ped){ const n=SHARED.ped.length; SHARED.ped=SHARED.ped.filter(r=>r.ts>=(pedTemLab(r)?v12:v00)); if(SHARED.ped.length!==n) mudou=true; }   /* laboratório: 00:00 e 12:00 · demais: 00:00 */
  SVCS.forEach(k=>{ const st=SV[k]; if(!st||!st.archive) return; const n=st.archive.length; st.archive=st.archive.filter(a=>!arqVence(a,now)); if(st.archive.length!==n) mudou=true; });
  if(mudou){ try{ pushDirty(); }catch(e){} if(view==="exames"&&!document.querySelector(".overlay")) renderExames(); }
}

}

function pocusSheet(r,blank){
  const dt=blank?null:new Date(r.ts||Date.now());
  const quando=dt?dt.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"___/___/______";
  const bl=blank?{}:recBlocos(r);
  const ids=blank?POC_BLOCOS.map(B=>B.id):blocosPreenchidos(bl).map(B=>B.id);
  const n=ids.length, g0=pA({});
  const bx=on=>`<i class="bx${on?" on":""}"></i>`;
  const blocks=ids.map(id=>{
    const B=POC_BLOCOS.find(x=>x.id===id), vals=(bl[id]&&bl[id].vals)||{};
    const rows=B.itens.map(it=>{
      const v=vals[it.id]||{};
      const opts=POC_OP[it.op].map(([k,l])=>{
        const on=Array.isArray(v.st)?v.st.includes(k):v.st===k;
        const warn=on&&["alt","pres","hiper","hipo","D","E","card"].includes(k);
        return `<span class="ck${on?" on":""}${warn?" warn":""}">${bx(on)}${esc(l)}</span>`;
      }).join("");
      const nums=(it.nums||[]).map((u,i)=>{ const x=v.n&&v.n[i]; return (x?`<b>${esc(x)}</b>`:"____")+(u?" "+esc(u):""); }).join(" / ");
      return `<tr><td class="n">${esc(it.nome)}${(n<=2&&it.sub)?`<small>${esc(it.sub)}</small>`:""}<small>Ref.: ${esc(it.ref)}</small></td><td class="o">${opts}</td><td class="v">${nums}</td></tr>`;
    }).join("");
    let foot;
    if(blank){
      foot=`<div class="ip"><b>Fluxograma</b><ul>${B.regras.map(x=>{ const t=typeof x.t==="function"?x.t(g0):x.t; return `<li><b>${esc(x.a)}</b>${t?" → "+esc(t):""}</li>`; }).join("")}</ul></div>`;
    } else {
      const rs=pocusInterp(B,vals);
      foot=`<div class="ip"><b>Interpretação</b>${rs.length?`<ul>${rs.map(x=>`<li class="${x.alerta?"al":""}"><b>${esc(x.a)}</b>${x.t?" → "+esc(x.t):""}</li>`).join("")}</ul>`:` <span class="mu">nenhuma regra do fluxograma acionada.</span>`}</div>`;
    }
    return `<section class="bk"><h2>${esc(B.titulo)}</h2><table><tbody>${rows}</tbody></table>${foot}</section>`;
  }).join("");
  const sn=blank?null:(r.snap||null);
  const cell=(l,v)=>`<div><small>${l}</small><b>${v||"&nbsp;"}</b></div>`;
  const pat=`<div class="pat">${cell("Paciente",blank?"":esc(r.iniciais))}${cell("Idade",sn&&sn.idade?esc(sn.idade)+" anos":"")}${cell("Leito",blank?"":esc(leitoDoRegistro(r)))}${cell("Data / hora",esc(quando))}${cell("Examinador",blank?"":esc(r.examinador))}</div>`;
  const prob=(sn&&sn.problemas&&sn.problemas.length)?`<p class="pl"><b>Problemas:</b> ${sn.problemas.map(esc).join("; ")}</p>`:"";
  const dv=(sn&&sn.disp&&sn.disp.length)?`<p class="pl"><b>Dispositivos:</b> ${sn.disp.map(x=>x.alert?`<span class="dv-al">⚠ ${esc(x.txt)}</span>`:esc(x.txt)).join("; ")}</p>`:"";
  const logo=SHARED.logo?`<img src="${SHARED.logo}" style="height:34pt" alt="">`:"";
  const head=`<div class="ph">${logo}<div><h1>POCUS à beira-leito</h1><div class="sub">${esc(SV.med.unit)}</div></div></div>`;
  return `<style>${POC_CSS}</style><div class="sheet-portrait pocs s${Math.min(n,3)}">${head}${pat}${prob}${dv}<div class="grid n${n}">${blocks}</div><div class="obs"><b>Observações:</b> ${(!blank&&r.obs)?esc(r.obs).replace(/\n/g,"<br>"):""}</div><div class="ft">${esc(POC_RODAPE)}</div></div>`;
}
function fitSheet(pa){                /* garante uma única folha: reduz a escala se o conteúdo passar da página */
  const sh=pa.querySelector(".pocs"); if(!sh) return;
  const keep=pa.getAttribute("style");
  pa.style.cssText="display:block;position:absolute;left:-10000px;top:0;width:190mm;visibility:hidden";
  sh.style.zoom="";
  const maxH=Math.floor(277/25.4*96)-8;
  const h=sh.scrollHeight;
  if(h>maxH) sh.style.zoom=Math.max(0.5,maxH/h).toFixed(3);
  if(keep===null) pa.removeAttribute("style"); else pa.setAttribute("style",keep);
}
function printHtml(h){ const pa=$("#printArea"); pa.innerHTML=h; fitSheet(pa); window.print(); }
function pocusPrint(blank){
  const d=pdraft;
  if(blank){ printHtml(pocusSheet({},true)); return; }
  if(!d||!pocusHasData(d)){ toast("Marque ao menos um achado antes de imprimir"); return; }
  printHtml(pocusSheet(pocusRecord(d),false));
}
function pocusHist(){
  const body=el("div");
  function draw(){
    body.innerHTML="";
    if(!SHARED.pocus.length){ body.append(el("p",{class:"hint"},"Nenhum exame salvo ainda.")); return; }
    SHARED.pocus.forEach((r,i)=>{
      const nomes=blocosPreenchidos(recBlocos(r)).map(x=>x.curto).join(" + ")||"POCUS";
      const when=new Date(r.ts).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
      body.append(el("div",{class:"list-item",style:"padding:8px 0"},
        el("div",{style:"flex:1"},el("b",{},nomes+" · "+(leitoDoRegistro(r)||"sem leito")+(r.iniciais?" · "+r.iniciais:"")),
          el("div",{class:"hint",style:"margin:0"},when+(r.examinador?" · "+r.examinador:""))),
        el("button",{class:"btn small",onclick:()=>printHtml(pocusSheet(r,false))},"Imprimir"),
        el("button",{class:"btn small danger",onclick:()=>{ if(confirm("Excluir este exame do histórico?")){ SHARED.pocus.splice(i,1); save(); draw(); } }},"Excluir")));
    });
  }
  draw(); openModal("Histórico do POCUS",body);
}

function xdNew(){
  return {tab:"menu",leito:"",nome:"",idade:"",plano:"",guia:"auto",diagOff:[],diagExtra:[],

function xBed(){ return xd&&xd.leito?SV.med.beds.find(x=>x.id===xd.leito):null; }

  xd.leito=id; xd.diagOff=[]; const b=SV.med.beds.find(x=>x.id===id);
  if(b&&bedHasPatient(b)){ xd.nome=b.nome||""; xd.idade=b.idade||""; xd.plano=b.plano||""; }

function xRxAuto(d){ return d.img.some(i=>i.nome===X_RXT)?(d.rxJust||[]).filter(k=>X_RXJ[k]).map(k=>X_RXJ[k]):[]; }
function xDiagOf(d){
  const au=xRxAuto(d); if(au.length) return au;      /* justificativa automática do RX de tórax substitui os diagnósticos */
  const b=d.leito?SV.med.beds.find(x=>x.id===d.leito):null;
  const base=b?b.problemas.filter(p=>!d.diagOff.includes(p)):[];
  return base.concat((d.diagExtra||[]).filter(x=>!base.includes(x)));
