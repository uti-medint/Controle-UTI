function exLinha(i){ return i.nome+(i.anest?" com suporte anestésico":""); }
function junta(a){ return a.length<2?a.join(""):a.slice(0,-1).join(", ")+" e "+a[a.length-1]; }
function motivosDe(i){ return (i.motivos||[]).concat(String(i.outro||"").trim()?[String(i.outro).trim()]:[]); }
function textoSuporte(itens){
  const g={}; itens.filter(i=>i.anest&&i.nome).forEach(i=>{ const m=motivosDe(i), k=m.join("|"); (g[k]=g[k]||{m,ex:[]}).ex.push(i.nome); });
  return Object.values(g).map(x=>"Solicito suporte anestésico para "+junta(x.ex)+(x.m.length?" por paciente em "+junta(x.m):"")+".");
}
function xPedidos(d){
  const ps=[];
  const labL=[].concat(X_ROT,X_CULT,X_ADM).filter(x=>d.lab.sel.includes(x)).concat(d.lab.livres||[]);
  if(labL.length) ps.push({tipo:"lab",titulo:"Exames laboratoriais",linhas:labL,rel:false});
  if(d.lab.gaso) ps.push({tipo:"gaso",titulo:"Gasometria",linhas:["Gasometria "+(d.lab.tipo==="venosa"?"venosa":"arterial")],rel:false});
  const im=d.img.filter(i=>i.nome);
  if(im.length) ps.push({tipo:"img",titulo:"Exames de imagem",linhas:im.map(exLinha),rel:im.some(precisaRel),relTxt:d.relImg,sup:textoSuporte(im)});
  const lv=d.livre.filter(i=>i.nome);
  if(lv.length) ps.push({tipo:"livre",titulo:"Solicitação livre",linhas:lv.map(exLinha),rel:lv.some(precisaRel),relTxt:d.relLivre,sup:textoSuporte(lv)});
  return ps;
}

function pedidoSheets(ctx,p){

function fitFields(root){            /* reduz a fonte dos campos que não cabem */

function xPrintHtml(html){

/* ---- revisão, impressão e histórico ---- */
function xRecord(){
  return {ts:Date.now(),por:netUser||"",leito:xd.leito,ctx:{nome:xd.nome,idade:xd.idade,plano:xd.plano,guia:xGuia(xd),diag:xDiagOf(xd)},d:JSON.parse(JSON.stringify(xd))};
}
function xReview(){
  const ps=xPedidos(xd), g=xGuia(xd);
  if(!ps.length){ toast("Marque ao menos um exame"); return; }
  if(!g){ alert("Escolha a guia (IPASGO, UNIMED ou Particular): o plano do paciente não foi reconhecido."); return; }
  const ctx=xCtx(); const html=xSheetsHtml(ctx,xd);
  const prev=el("div",{class:"xprev"}); prev.innerHTML=html;
  const warn=[];
  if(!ctx.nome) warn.push("Paciente sem nome.");
  if(!ctx.diag.length) warn.push("Nenhum diagnóstico selecionado.");
  ps.forEach(p=>{ if(p.rel&&!p.relTxt) warn.push("O pedido de “"+p.titulo+"” precisa de relatório e ele está vazio."); });
  const body=el("div",{},
    el("p",{class:"hint"},"Serão impressas as folhas abaixo: "+ps.map(p=>p.titulo+" ("+nGuias(p,g)+(g==="particular"?" folha(s)":" guia(s)")+(p.rel?" + relatório":"")+")").join("; ")+". Guia: "+X_GUIAS[g]+"."),
    warn.length?el("div",{class:"warn",style:"margin-bottom:10px"},...warn.map(w=>el("div",{},"⚠ "+w))):null,
    el("div",{style:"display:flex;gap:10px;margin-bottom:12px"},
      el("button",{class:"btn primary",type:"button",onclick:()=>{
        if(warn.length&&!confirm("Há avisos neste pedido. Imprimir mesmo assim?")) return;
        const rec=xRecord(); SHARED.ped.unshift(rec); if(SHARED.ped.length>150) SHARED.ped.length=150; save();
        xPrintHtml(html);
      }},"Imprimir e salvar no histórico")),prev);
  openModal("Revisar pedido",body); fitFields(prev);
}
function xHist(){
  const body=el("div");
  function draw(){
    body.innerHTML="";
    if(!SHARED.ped.length){ body.append(el("p",{class:"hint"},"Nenhum pedido impresso ainda.")); return; }
    SHARED.ped.forEach((r,i)=>{
      const when=new Date(r.ts).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
      const ps=xPedidos(r.d);
      body.append(el("div",{class:"list-item",style:"padding:8px 0"},
        el("div",{style:"flex:1"},el("b",{},(r.ctx.nome||"Sem nome")+(r.leito?" · "+leitoLabel(r.leito):"")),
          el("div",{class:"hint",style:"margin:0"},when+" · "+ps.map(p=>p.titulo).join(", ")+(r.por?" · "+r.por:""))),
        el("button",{class:"btn small",type:"button",onclick:()=>{ const ctx=Object.assign({},r.ctx,{data:new Date(r.ts)}); xPrintHtml(xSheetsHtml(ctx,r.d)); }},"Imprimir"),
        el("button",{class:"btn small",type:"button",onclick:()=>{ xd=JSON.parse(JSON.stringify(r.d)); xd.tab="menu"; document.querySelectorAll(".overlay").forEach(o=>o.remove()); renderExames(); }},"Reabrir"),
        el("button",{class:"btn small danger",type:"button",onclick:()=>{ if(confirm("Excluir este pedido do histórico?")){ SHARED.ped.splice(i,1); save(); draw(); } }},"Excluir")));
    });
  }
  draw(); openModal("Histórico de pedidos de exames",body);
}

/* ============ Inicialização ============ */
async function init(){
  const fb=await window.fbReady;
  if(fb){
    NET=true;
    try{
      const u=await requireLogin();
      netUser=(u.email||"usuário").split("@")[0];
      const shown=(u.email||"").endsWith("@"+USER_DOMAIN)?(u.email||"").split("@")[0]:(u.email||"");
      $("#userInfo").textContent=shown; $("#hubUser").textContent=shown;
      const sair=()=>FB.signOut().then(()=>location.reload());
      ["#bSair","#hubSair"].forEach(q=>{ const b=$(q); b.hidden=false; b.onclick=sair; });
      await netStart();
    }catch(e){
      if(e&&e.code==="permission-denied"){ blockAccess(); return; }
      console.error(e);
      document.body.innerHTML="<p style='padding:30px;font:16px sans-serif'>Não foi possível carregar os dados. Verifique a internet e recarregue a página (F5).</p>"; return;
    }
  } else {
    if(!confirm("Não foi possível conectar ao serviço online (sem internet?).\n\nUsar o modo local, somente neste computador e sem sincronização?")){
      document.body.innerHTML="<p style='padding:30px;font:16px sans-serif'>Sem conexão. Recarregue a página (F5) quando a internet voltar.</p>"; return;
    }
    load();
  }
  $("#hUnit").addEventListener("input",e=>{S.unit=e.target.value;save();});
  $("#hData").addEventListener("input",e=>{ if(e.target.value){S.data=e.target.value; save(); renderEditor();} });
  $("#bLists").onclick=listsModal; $("#bHist").onclick=histModal; $("#bBackup").onclick=backupModal; $("#bLogo").onclick=logoModal;
  $("#bNovo").onclick=novoPlantao; $("#bPrint").onclick=doPrint; $("#bWord").onclick=doWord;
  $("#bMenu").onclick=()=>showView("hub"); $("#hubLogoBtn").onclick=logoModal;
  showView("hub");
}
init();
